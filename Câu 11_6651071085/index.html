<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 class="text-center">Custom File Input</h2>

<div class="custom-file-wrp">
	<div class="filename">
		Ex:sample.jpg
	</div>
	<div class="custom-file">
		<label for="fileupload">Upload</label>
		<input type="file"  id="fileupload">
	</div>
</div>

<script src="jquery-latest.min.js"></script>

<script>
$(document).ready(function(){
    $('#fileupload').on('change', function() {
        // Lấy đường dẫn file và tách lấy phần tên file kèm phần mở rộng
        var fileName = $(this).val().split('\\').pop();
        
        // Kiểm tra nếu có file được chọn thì hiển thị tên, nếu không thì thông báo
        if (fileName) {
            $('.filename').text(fileName);
        } else {
            $('.filename').text('Chưa có file nào được chọn');
        }
    });
});
</script>

</body>
</html>
