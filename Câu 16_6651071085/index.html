<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thêm và xóa hàng trong Table </title>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body style="border:1px solid grey">
  	<h2>Quản lý thông tin user</h2>
    <form>
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="email" placeholder="Email Address">
        <input type="text" placeholder="Birthdate" id="datepicker">
    	<input type="button" class="add-row" value="Add Row">
    </form>
    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Name</th>
                <th>Email</th>
                <th>Birthdate</th>
            </tr>
        </thead>
        <tbody>
           
        </tbody>
    </table>
    <button type="button" class="delete-row">Delete Row</button>
    <script>
        $(document).ready(function () {
            // Khởi tạo jQuery UI Datepicker cho ô Birthdate
            $("#datepicker").datepicker({
                dateFormat: "dd/mm/yy",
                changeMonth: true,
                changeYear: true,
                yearRange: "1920:2030"
            });

            // Hàm kiểm tra định dạng email
            function isValidEmail(email) {
                var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailPattern.test(email);
            }

            // Xử lý nút "Add Row"
            $(".add-row").on("click", function () {
                var name = $("#name").val().trim();
                var email = $("#email").val().trim();
                var birthdate = $("#datepicker").val().trim();

                // Kiểm tra tên
                if (name === "") {
                    alert("Vui lòng nhập Name!");
                    $("#name").focus();
                    return;
                }

                // Kiểm tra định dạng Email
                if (email === "") {
                    alert("Vui lòng nhập Email Address!");
                    $("#email").focus();
                    return;
                }
                if (!isValidEmail(email)) {
                    alert("Email không đúng định dạng! Vui lòng nhập lại (ví dụ: user@example.com)");
                    $("#email").focus();
                    return;
                }

                // Kiểm tra Birthdate
                if (birthdate === "") {
                    alert("Vui lòng chọn ngày sinh (Birthdate)!");
                    $("#datepicker").focus();
                    return;
                }

                // Thêm hàng mới vào bảng
                var markup = "<tr>" +
                    "<td><input type='checkbox' name='record'></td>" +
                    "<td>" + $("<div>").text(name).html() + "</td>" +
                    "<td>" + $("<div>").text(email).html() + "</td>" +
                    "<td>" + $("<div>").text(birthdate).html() + "</td>" +
                    "</tr>";
                $("table tbody").append(markup);

                // Xóa trắng form sau khi thêm
                $("#name").val("");
                $("#email").val("");
                $("#datepicker").val("");
            });

            // Xử lý nút "Delete Row"
            $(".delete-row").on("click", function () {
                var checkedRows = $("table tbody input[name='record']:checked");
                if (checkedRows.length === 0) {
                    alert("Vui lòng tích chọn ít nhất một hàng cần xóa!");
                    return;
                }

                // Xóa các hàng đã được tích chọn
                checkedRows.closest("tr").remove();
            });
        });
    </script>
</body> 
</html>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
